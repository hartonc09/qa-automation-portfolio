name: Playwright Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Install dependencies
      run: npm ci

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps

    # 1. Run tests -> outputs Playwright report HTML directly into public/reports/
    - name: Run Playwright tests
      run: npx playwright test
      env:
        BASE_URL: https://chrishartonqa.com

    # 2. Build React App -> Vite automatically copies public/ (and public/reports) into dist/
    - name: Build Web Application
      run: npm run build

    # 3. Deploy the full dist/ directory (React App + Reports) to Cloudflare Pages
    - name: Deploy Full Site to Cloudflare Pages
      if: always()
      uses: cloudflare/pages-action@v1
      with:
        apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        projectName: qa-automation-portfolio
        directory: dist